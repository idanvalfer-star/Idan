# One-click deploy on Render (render.com). New → Blueprint → pick this repo/branch.
# FREE option: provide GEMINI_API_KEY (free from aistudio.google.com, no billing).
# Or use ANTHROPIC_API_KEY (paid) for Claude. OPENAI_API_KEY is optional (audio).
services:
  - type: web
    name: cartly
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
