<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22c55e">
<title>Cartly — Reset Password</title>
<script src="/vendor/supabase.js"></script>
<script>window.supabaseLib = window.supabase;</script>
<style>
:root{
  --bg:#0e1512; --card:#16201b; --ink:#e8f2ea; --muted:#9db3a6;
  --line:#24322b; --accent:#34d399; --accent-2:#22c55e; --accent-soft:#12241b;
  --shadow:0 10px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 12px rgba(0,0,0,.35);
  --radius:20px;
}
[data-theme="light"]{
  --bg:#f5f7f3; --card:#fafbf9; --ink:#15271c; --muted:#7a8d80;
  --line:#dde5db; --accent:#22c55e; --accent-2:#16a34a; --accent-soft:#e0f7eb;
  --shadow:0 8px 30px rgba(20,60,35,.08); --shadow-sm:0 2px 10px rgba(20,60,35,.06);
}
/* Kill iOS double-tap zoom. touch-action is not inherited, so it has to be
   set on every element; pinch-to-zoom deliberately still works. */
*{box-sizing:border-box;touch-action:manipulation}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:background .3s,color .3s;
}
.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:40px 30px;
  border-radius:24px;
  box-shadow:var(--shadow);
}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:48px;margin-bottom:12px;display:block}
h1{margin:0;font-size:28px;font-weight:800;color:var(--ink);margin-bottom:4px}
.subtitle{margin:0;font-size:14px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.3px}
.field-wrapper{position:relative;display:flex;align-items:stretch}
.field-wrapper input{flex:1}
.toggle-password{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;
  padding:0;width:24px;height:24px;display:grid;place-items:center;transition:.2s}
.toggle-password:active{color:var(--accent)}
input{
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  transition:.2s;
  font-family:inherit;
}
input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
input::placeholder{color:var(--muted)}
.error{
  display:none;
  padding:12px 14px;
  background:#fee;
  border-radius:12px;
  color:#c00;
  font-size:13px;
  font-weight:600;
  border:1px solid #fcc;
}
.error.show{display:block}
.success{
  display:none;
  padding:12px 14px;
  background:#efe;
  border-radius:12px;
  color:#060;
  font-size:13px;
  font-weight:600;
  border:1px solid #cfc;
}
.success.show{display:block}
.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-weight:800;
  font-size:16px;
  padding:14px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .12s;
  font-family:inherit;
}
.btn:active{transform:scale(.98)}
.theme-btn{
  position:fixed;
  top:20px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--card);
  border:none;
  cursor:pointer;
  font-size:20px;
  box-shadow:var(--shadow-sm);
  transition:transform .15s;
}
.theme-btn:active{transform:scale(.9)}
.link-section{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-top:20px;
}
.link-section a{
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.link-section a:hover{opacity:.8}
</style>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="container">
  <div class="header">
    <span class="logo">🛒</span>
    <h1>Cartly</h1>
    <p class="subtitle">Create a new password</p>
  </div>

  <form class="form" id="resetForm" onsubmit="return handleReset(event)">
    <div class="field">
      <label for="newPassword">New Password</label>
      <div class="field-wrapper">
        <input id="newPassword" type="password" placeholder="Create a new password" required style="padding-right:40px">
        <button type="button" class="toggle-password" id="togglePassword" title="Show/hide password">👁️</button>
      </div>
    </div>
    <div class="field">
      <label for="confirmPassword">Confirm Password</label>
      <div class="field-wrapper">
        <input id="confirmPassword" type="password" placeholder="Confirm your password" required style="padding-right:40px">
        <button type="button" class="toggle-password" id="toggleConfirm" title="Show/hide password">👁️</button>
      </div>
    </div>
    <div class="error" id="resetError"></div>
    <div class="success" id="resetSuccess"></div>
    <button type="submit" class="btn">Reset Password</button>
  </form>

  <div class="link-section">
    <a href="/login">Back to Sign In</a>
  </div>
</div>

<script type="module">
import { updatePasswordWithToken, supabase } from './supabase-service.js';

// Apply theme
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}

const theme = localStorage.getItem('cartly.theme') || 'dark';
applyTheme(theme);

document.getElementById('themeBtn').onclick = () => {
  const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('cartly.theme', newTheme);
  applyTheme(newTheme);
};

// Check if user has valid session from reset token
(async () => {
  const errorEl = document.getElementById('resetError');
  try {
    const { data: { session }, error: sessionError } = await supabase.auth.getSession();
    if (sessionError || !session) {
      // Invalid or expired token
      errorEl.textContent = '❌ Invalid or expired reset link. Please request a new password reset.';
      errorEl.classList.add('show');
      document.getElementById('resetForm').style.display = 'none';
    }
  } catch (e) {
    errorEl.textContent = 'Error verifying reset token. Please try again.';
    errorEl.classList.add('show');
  }
})();

// Toggle password visibility
document.getElementById('togglePassword').onclick = (e) => {
  e.preventDefault();
  const input = document.getElementById('newPassword');
  const btn = document.getElementById('togglePassword');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
};

document.getElementById('toggleConfirm').onclick = (e) => {
  e.preventDefault();
  const input = document.getElementById('confirmPassword');
  const btn = document.getElementById('toggleConfirm');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
};

// Handle password reset
window.handleReset = async function(e) {
  e.preventDefault();
  const newPassword = document.getElementById('newPassword').value;
  const confirmPassword = document.getElementById('confirmPassword').value;
  const errorEl = document.getElementById('resetError');
  const successEl = document.getElementById('resetSuccess');

  errorEl.classList.remove('show');
  successEl.classList.remove('show');

  if (newPassword.length < 6) {
    errorEl.textContent = 'Password must be at least 6 characters';
    errorEl.classList.add('show');
    return false;
  }

  if (newPassword !== confirmPassword) {
    errorEl.textContent = 'Passwords do not match';
    errorEl.classList.add('show');
    return false;
  }

  try {
    const { error } = await supabase.auth.updateUser({ password: newPassword });

    if (error) throw error;

    successEl.textContent = '✓ Password reset successfully! Redirecting to sign in...';
    successEl.classList.add('show');

    setTimeout(() => {
      window.location.href = '/login';
    }, 2000);
  } catch (error) {
    errorEl.textContent = error.message || 'Failed to reset password';
    errorEl.classList.add('show');
  }

  return false;
};
</script>
