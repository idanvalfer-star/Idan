<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Treasure Hunter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>💠</text></svg>" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0f0d; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: #e8dcc0; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; }
    /* UI overlays (HUD, menus) are injected into #ui by the game */
    #ui { position: absolute; inset: 0; pointer-events: none; }
    #ui .clickable { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="app">
    <div id="ui"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
