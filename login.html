<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22c55e">
<title>Cartly — Sign In</title>
<style>
:root{
  --bg:#0e1512; --card:#16201b; --ink:#e8f2ea; --muted:#9db3a6;
  --line:#24322b; --accent:#34d399; --accent-2:#22c55e; --accent-soft:#12241b;
  --shadow:0 10px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 12px rgba(0,0,0,.35);
  --radius:20px;
}
[data-theme="light"]{
  --bg:#f5f7f3; --card:#fafbf9; --ink:#15271c; --muted:#7a8d80;
  --line:#dde5db; --accent:#22c55e; --accent-2:#16a34a; --accent-soft:#e0f7eb;
  --shadow:0 8px 30px rgba(20,60,35,.08); --shadow-sm:0 2px 10px rgba(20,60,35,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:background .3s,color .3s;
}
.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:40px 30px;
  border-radius:24px;
  box-shadow:var(--shadow);
}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:48px;margin-bottom:12px;display:block}
h1{margin:0;font-size:28px;font-weight:800;color:var(--ink);margin-bottom:4px}
.subtitle{margin:0;font-size:14px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.3px}
input{
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  transition:.2s;
  font-family:inherit;
}
input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
input::placeholder{color:var(--muted)}
.field-wrapper{position:relative;display:flex;align-items:stretch}
.field-wrapper input{flex:1}
.toggle-password{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;
  padding:0;width:24px;height:24px;display:grid;place-items:center;transition:.2s}
.toggle-password:active{color:var(--accent)}
.error{
  display:none;
  padding:12px 14px;
  background:#fee;
  border-radius:12px;
  color:#c00;
  font-size:13px;
  font-weight:600;
  border:1px solid #fcc;
}
.error.show{display:block}
.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-weight:800;
  font-size:16px;
  padding:14px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .12s;
  font-family:inherit;
}
.btn:active{transform:scale(.98)}
.btn.secondary{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  margin-top:8px;
}
.divider{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin:20px 0;
  display:flex;
  align-items:center;
  gap:12px;
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}
.link-section{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-top:20px;
}
.link-section a{
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.link-section a:hover{opacity:.8}
.forgot-link{
  text-align:center;
  margin-top:12px;
  font-size:13px;
}
.forgot-link a{
  color:var(--muted);
  text-decoration:none;
  font-weight:600;
  cursor:pointer;
  transition:.2s;
}
.forgot-link a:hover{color:var(--accent)}
.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.5);
  z-index:1000;
  align-items:center;
  justify-content:center;
}
.modal.show{display:flex}
.modal-content{
  background:var(--card);
  padding:40px 30px;
  border-radius:24px;
  box-shadow:var(--shadow);
  width:100%;
  max-width:400px;
  margin:20px;
}
.modal-header{
  font-size:20px;
  font-weight:800;
  margin-bottom:16px;
  color:var(--ink);
}
.modal-text{
  font-size:14px;
  color:var(--muted);
  margin-bottom:20px;
  line-height:1.5;
}
.modal-field{
  margin-bottom:16px;
}
.modal-field label{
  display:block;
  font-size:13px;
  font-weight:700;
  color:var(--ink);
  margin-bottom:6px;
  text-transform:uppercase;
  letter-spacing:.3px;
}
.modal-field input{
  width:100%;
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  font-family:inherit;
  transition:.2s;
}
.modal-field input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
.modal-buttons{
  display:flex;
  gap:12px;
}
.modal-buttons button{
  flex:1;
  padding:12px 16px;
  border-radius:12px;
  border:none;
  font-weight:800;
  font-size:15px;
  cursor:pointer;
  transition:transform .12s;
  font-family:inherit;
}
.modal-buttons .primary{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent);
}
.modal-buttons .primary:active{transform:scale(.98)}
.modal-buttons .secondary{
  background:var(--bg);
  color:var(--ink);
  border:1px solid var(--line);
}
.modal-buttons .secondary:active{transform:scale(.98)}
.success-message{
  display:none;
  padding:12px 14px;
  background:#efe;
  border-radius:12px;
  color:#060;
  font-size:13px;
  font-weight:600;
  border:1px solid #cfc;
  margin-bottom:16px;
}
.success-message.show{display:block}
.theme-btn{
  position:fixed;
  top:20px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--card);
  border:none;
  cursor:pointer;
  font-size:20px;
  box-shadow:var(--shadow-sm);
  transition:transform .15s;
}
.theme-btn:active{transform:scale(.9)}
</style>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="container">
  <div class="header">
    <span class="logo">🛒</span>
    <h1>Cartly</h1>
    <p class="subtitle">Sign in to your family account</p>
  </div>

  <div class="success-message" id="successMessage"></div>

  <form class="form" id="loginForm" onsubmit="return handleLogin(event)">
    <div class="field">
      <label for="loginEmail">Email</label>
      <input id="loginEmail" type="email" placeholder="Enter your email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="loginPassword">Password</label>
      <div class="field-wrapper">
        <input id="loginPassword" type="password" placeholder="Enter your password" required autocomplete="current-password" style="padding-right:40px">
        <button type="button" class="toggle-password" id="toggleLoginPassword" title="Show/hide password">👁️</button>
      </div>
    </div>
    <div class="error" id="loginError"></div>
    <button type="submit" class="btn">Sign In</button>
  </form>

  <div class="forgot-link">
    <a onclick="openForgotModal()">Forgot Password?</a>
  </div>

  <button type="button" class="btn secondary" onclick="guestLogin()">Continue as Guest</button>

  <div class="divider">or</div>
  <div class="link-section">
    Don't have an account? <a href="/signup">Sign Up</a>
  </div>
</div>

<!-- Forgot Password Modal -->
<div class="modal" id="forgotModal">
  <div class="modal-content">
    <div class="modal-header">Reset Password</div>
    <div class="modal-text">
      Password recovery is not yet available. Please contact support.
    </div>
    <div class="modal-buttons">
      <button type="button" class="secondary" onclick="closeForgotModal()">Close</button>
    </div>
  </div>
</div>

<script type="module">
import { loginWithPassword, guestLogin as guestLoginFn, getCurrentUser, initAuth } from './supabase-service.js';

// Apply theme
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}

const theme = localStorage.getItem('cartly.theme') || 'dark';
applyTheme(theme);

document.getElementById('themeBtn').onclick = () => {
  const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('cartly.theme', newTheme);
  applyTheme(newTheme);
};

// Check if already authenticated
async function checkAuth() {
  await initAuth();
  if (getCurrentUser()) {
    window.location.href = '/app';
  }
}
checkAuth();

// Handle login with email + password
window.handleLogin = async function(e) {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.classList.remove('show');

  // Validate email format
  if (!isValidEmail(email)) {
    errorEl.textContent = 'Please enter a valid email address';
    errorEl.classList.add('show');
    return false;
  }

  if (!password) {
    errorEl.textContent = 'Please enter your password';
    errorEl.classList.add('show');
    return false;
  }

  // Try login with Supabase
  const result = await loginWithPassword(email, password);

  if (result.success) {
    window.location.href = '/app';
  } else {
    let errorMsg = result.error || 'Login failed';

    // Make error messages clearer
    if (errorMsg.includes('Invalid login credentials') || errorMsg.includes('invalid') || errorMsg.includes('not found')) {
      errorMsg = 'Invalid email or password. Please check and try again.';
    } else if (errorMsg.includes('User not found')) {
      errorMsg = 'No account found with this email. Please sign up first.';
    }

    errorEl.textContent = errorMsg;
    errorEl.classList.add('show');
  }
  return false;
};

// Email validation helper
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

// Toggle password visibility
document.getElementById('toggleLoginPassword').onclick = (e) => {
  e.preventDefault();
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('toggleLoginPassword');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
};

// Forgot family code modal
window.openForgotModal = function() {
  document.getElementById('forgotModal').classList.add('show');
  document.getElementById('forgotEmail').value = '';
  document.getElementById('forgotError').classList.remove('show');
};

window.closeForgotModal = function() {
  document.getElementById('forgotModal').classList.remove('show');
};

window.sendFamilyCode = async function() {
  const email = document.getElementById('forgotEmail').value.trim();
  const errorEl = document.getElementById('forgotError');
  errorEl.classList.remove('show');

  if (!isValidEmail(email)) {
    errorEl.textContent = 'Please enter a valid email address';
    errorEl.classList.add('show');
    return;
  }

  errorEl.textContent = 'Contact support to recover your family code';
  errorEl.classList.add('show');
};

// Close modal when clicking outside
document.getElementById('forgotModal').onclick = function(e) {
  if (e.target === this) {
    closeForgotModal();
  }
};

// Handle guest login
window.guestLogin = function() {
  guestLoginFn();
  window.location.href = '/app';
};
</script>
