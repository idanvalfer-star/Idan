<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22c55e">
<title>Cartly — Sign In</title>
<style>
:root{
  --bg:#fbfdf7; --card:#ffffff; --ink:#15271c; --muted:#6b7d72;
  --line:#e7efe6; --accent:#22c55e; --accent-2:#16a34a; --accent-soft:#e9fbef;
  --shadow:0 8px 30px rgba(20,60,35,.08); --shadow-sm:0 2px 10px rgba(20,60,35,.06);
  --radius:20px;
}
[data-theme="dark"]{
  --bg:#0e1512; --card:#16201b; --ink:#e8f2ea; --muted:#9db3a6;
  --line:#24322b; --accent:#34d399; --accent-2:#22c55e; --accent-soft:#12241b;
  --shadow:0 10px 34px rgba(0,0,0,.45); --shadow-sm:0 2px 12px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:
    radial-gradient(900px 500px at 100% -8%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
    radial-gradient(800px 420px at -10% 8%, color-mix(in srgb, var(--pink) 10%, transparent), transparent 55%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  transition:background .3s,color .3s;
}
.container{
  width:100%;
  max-width:420px;
  background:var(--card);
  padding:40px 30px;
  border-radius:24px;
  box-shadow:var(--shadow);
}
.header{text-align:center;margin-bottom:32px}
.logo{font-size:48px;margin-bottom:12px;display:block}
h1{margin:0;font-size:28px;font-weight:800;color:var(--ink);margin-bottom:4px}
.subtitle{margin:0;font-size:14px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
label{font-size:13px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.3px}
input{
  padding:12px 14px;
  border:1.5px solid var(--line);
  border-radius:12px;
  background:var(--bg);
  color:var(--ink);
  font-size:15px;
  transition:.2s;
  font-family:inherit;
}
input:focus{
  outline:none;
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft);
}
input::placeholder{color:var(--muted)}
.error{
  display:none;
  padding:12px 14px;
  background:#fee;
  border-radius:12px;
  color:#c00;
  font-size:13px;
  font-weight:600;
  border:1px solid #fcc;
}
.error.show{display:block}
.btn{
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-weight:800;
  font-size:16px;
  padding:14px 20px;
  border-radius:12px;
  border:none;
  cursor:pointer;
  box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent);
  transition:transform .12s;
  font-family:inherit;
}
.btn:active{transform:scale(.98)}
.btn.secondary{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line);
  box-shadow:var(--shadow-sm);
  margin-top:8px;
}
.divider{
  text-align:center;
  font-size:13px;
  color:var(--muted);
  margin:20px 0;
  display:flex;
  align-items:center;
  gap:12px;
}
.divider::before,.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:var(--line);
}
.link-section{
  text-align:center;
  font-size:14px;
  color:var(--muted);
  margin-top:20px;
}
.link-section a{
  color:var(--accent);
  text-decoration:none;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}
.link-section a:hover{opacity:.8}
.theme-btn{
  position:fixed;
  top:20px;
  right:20px;
  width:42px;
  height:42px;
  border-radius:14px;
  background:var(--card);
  border:none;
  cursor:pointer;
  font-size:20px;
  box-shadow:var(--shadow-sm);
  transition:transform .15s;
}
.theme-btn:active{transform:scale(.9)}
</style>

<button class="theme-btn" id="themeBtn">🌙</button>

<div class="container">
  <div class="header">
    <span class="logo">🛒</span>
    <h1>Cartly</h1>
    <p class="subtitle">Sign in to your family account</p>
  </div>

  <form class="form" id="loginForm" onsubmit="return handleLogin(event)">
    <div class="field">
      <label for="loginName">Name or Nickname</label>
      <input id="loginName" type="text" placeholder="Enter your name or nickname" required autocomplete="off">
    </div>
    <div class="field">
      <label for="loginFamilyCode">Family Code</label>
      <input id="loginFamilyCode" type="text" placeholder="Enter your family code" required autocomplete="off">
    </div>
    <div class="error" id="loginError"></div>
    <button type="submit" class="btn">Sign In</button>
  </form>

  <button type="button" class="btn secondary" onclick="guestLogin()">Continue as Guest</button>

  <div class="divider">or</div>
  <div class="link-section">
    Don't have an account? <a href="/signup">Sign Up</a>
  </div>
</div>

<script type="module">
import { login, guestLogin as guestLoginFn, enforceAuthRouting } from './auth.js';

// Apply theme
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  document.getElementById('themeBtn').textContent = t === 'dark' ? '☀️' : '🌙';
}

const theme = localStorage.getItem('cartly.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
applyTheme(theme);

document.getElementById('themeBtn').onclick = () => {
  const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  localStorage.setItem('cartly.theme', newTheme);
  applyTheme(newTheme);
};

// Check if already authenticated
enforceAuthRouting('/login');

// Handle login
window.handleLogin = function(e) {
  e.preventDefault();
  const name = document.getElementById('loginName').value.trim();
  const familyCode = document.getElementById('loginFamilyCode').value.trim();
  const result = login(name, familyCode);

  if (result.success) {
    window.location.href = '/app';
  } else {
    const errorEl = document.getElementById('loginError');
    errorEl.textContent = result.error;
    errorEl.classList.add('show');
  }
  return false;
};

// Handle guest login
window.guestLogin = function() {
  guestLoginFn();
  window.location.href = '/app';
};
</script>
